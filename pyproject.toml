[project]
name = "msgdrift"
version = "0.1.0"
description = "Detect when website messaging drifts from your positioning documents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "wpsands" }]
keywords = ["messaging", "positioning", "drift", "brand", "marketing", "agent", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "anthropic>=0.42.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "click>=8.1.0",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

[project.scripts]
msgdrift = "msgdrift.cli:main"

[project.urls]
Homepage = "https://github.com/wpsands/msgdrift"
Repository = "https://github.com/wpsands/msgdrift"
Issues = "https://github.com/wpsands/msgdrift/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/msgdrift"]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long — formatter handles this
    "SIM108", # ternary operator — often less readable
]

[tool.ruff.lint.isort]
known-first-party = ["msgdrift"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
